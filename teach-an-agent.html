<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Solitude — Teach an agent</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#f4f5f7;--card:#fff;--border:#e4e6ea;--border-strong:#d0d3d9;
    --muted:#6b7280;--fg:#0f172a;
    --blue:#2563eb;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-700:#1d4ed8;
    --purple:#7c3aed;--purple-50:#f5f3ff;
    --red-600:#dc2626;--red-50:#fef2f2;
    --amber-500:#f59e0b;--amber-600:#d97706;--amber-50:#fffbeb;
    --emerald-500:#10b981;--emerald-600:#059669;--emerald-50:#ecfdf5;
    --nav:#0b1220;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  #root{min-height:100vh}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d5d8de;border-radius:10px}

  .topnav{background:var(--nav);color:#fff;height:40px;display:flex;align-items:center;padding:0 16px;gap:16px;font-size:12.5px}
  .topnav .brand{display:flex;align-items:center;gap:6px;font-weight:600;color:#a78bfa}
  .topnav .nav-btn{padding:5px 10px;border-radius:4px;color:#c7cbd3;cursor:pointer}
  .topnav .nav-btn.active{background:var(--blue);color:#fff;font-weight:600}
  .topnav .nav-btn:hover:not(.active){background:#1a2236}
  .topnav .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#c7cbd3}
  .topnav .avatar{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,#6366f1,#a78bfa);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}

  .canvas{max-width:880px;margin:0 auto;padding:36px 32px 120px 32px}

  h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.015em;line-height:1.2}
  h2{font-size:17px;font-weight:600;margin:0 0 4px 0}
  .lede{color:var(--muted);font-size:15px;max-width:620px;margin-top:6px}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:#fff;color:var(--fg);padding:7px 13px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer}
  .btn:hover{background:#f8f9fb}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-700)}
  .btn-emerald{background:var(--emerald-600);border-color:var(--emerald-600);color:#fff}
  .btn-emerald:hover{background:#047857}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:#eef0f3}
  .btn-xs{padding:3px 9px;font-size:12px}
  .btn-lg{padding:12px 24px;font-size:15px;font-weight:600}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:2px 8px;font-size:11px;font-weight:600}
  .pill .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
  .pill-emerald{background:var(--emerald-50);color:var(--emerald-600)}
  .pill-amber{background:var(--amber-50);color:var(--amber-600)}
  .pill-gray{background:#eef0f3;color:#4b5563}

  /* STAGE 1: intro */
  .hero{background:#fff;border:1px solid var(--border);border-radius:10px;padding:40px 44px;margin-top:22px;position:relative;overflow:hidden}
  .hero .glow{position:absolute;top:-120px;right:-80px;width:380px;height:380px;background:radial-gradient(circle,rgba(124,58,237,.08),transparent 65%);pointer-events:none}
  .hero h1{max-width:600px}
  .hero .lede{margin-top:10px;font-size:16px}
  .startrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
  .start-card{border:1.5px solid var(--border);border-radius:8px;padding:22px;cursor:pointer;transition:all .12s;background:#fff;position:relative}
  .start-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(37,99,235,.06)}
  .start-card.primary{border-color:var(--blue);background:linear-gradient(180deg,#fafcff,#fff)}
  .start-card .icon{width:42px;height:42px;border-radius:10px;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
  .start-card.alt .icon{background:#f5f3ff;color:var(--purple)}
  .start-card .t{font-weight:600;font-size:15px;margin-bottom:4px}
  .start-card .s{color:var(--muted);font-size:13px;line-height:1.45}
  .start-card .badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;background:var(--blue);color:#fff;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em}

  .suggestions{margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
  .suggestions .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
  .sugg-row{display:flex;flex-wrap:wrap;gap:6px}
  .sugg{padding:6px 12px;background:#f4f5f7;border:1px solid transparent;border-radius:999px;font-size:12.5px;cursor:pointer;color:#4b5563}
  .sugg:hover{background:#fff;border-color:var(--border)}

  /* STAGE 2: recording */
  .rec-shell{background:#0b1220;border-radius:10px;overflow:hidden;margin-top:22px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .rec-bar{background:#111a2e;padding:10px 16px;display:flex;align-items:center;gap:12px;color:#c7cbd3;font-size:12.5px;border-bottom:1px solid #1f2a44}
  .rec-dot{width:10px;height:10px;border-radius:999px;background:#ef4444;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.3)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
  .rec-status{font-weight:600;color:#fff}
  .rec-clock{margin-left:auto;font-family:ui-monospace,monospace;color:#9aa3b7}
  .rec-stop{background:#ef4444;color:#fff;border:none;padding:6px 14px;border-radius:4px;font-weight:600;font-size:12.5px;cursor:pointer}

  .rec-frame{aspect-ratio:16/10;background:linear-gradient(135deg,#1e3a5f,#0c4a6e);position:relative;overflow:hidden}
  .rec-frame .watching{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:7px 12px;border-radius:5px;color:#fff;font-size:12px;display:flex;align-items:center;gap:8px;z-index:10}
  .rec-frame .watching .eye{width:16px;height:16px;background:#10b981;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:9px}

  .rec-app{position:absolute;left:10%;top:8%;width:78%;height:80%;background:#fff;border-radius:3px;border:1px solid #cbd5e0;display:flex;flex-direction:column}
  .rec-app .tb{background:#003366;color:#fff;padding:5px 10px;font-weight:700;font-size:11px}
  .rec-app .menu{background:#e6ebf1;padding:3px 8px;font-size:10px;color:#374151;display:flex;gap:10px;border-bottom:1px solid #cbd5e0}
  .rec-app .body{flex:1;padding:10px;font-size:10px}
  .rec-app .body table{width:100%;border-collapse:collapse}
  .rec-app .body th{background:#eef2f7;padding:3px 6px;text-align:left;border-bottom:1px solid #cbd5e0;font-size:9.5px}
  .rec-app .body td{padding:3px 6px;border-bottom:1px solid #f1f2f5;font-size:9.5px}
  .rec-app .body tr.on{background:#fef3c7}
  .rec-app .post{position:absolute;right:14%;bottom:12%;background:#10b981;color:#fff;padding:4px 14px;border-radius:2px;font-size:10px;font-weight:700;box-shadow:0 2px 8px rgba(16,185,129,.4)}

  .rec-cursor{position:absolute;width:18px;height:18px;pointer-events:none;z-index:5;transition:all .4s cubic-bezier(.3,0,.3,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  .rec-ripple{position:absolute;width:40px;height:40px;border-radius:999px;border:2px solid #fff;pointer-events:none;z-index:4;transform:translate(-50%,-50%);animation:ripple .6s ease-out forwards}
  @keyframes ripple{0%{width:0;height:0;opacity:1}100%{width:60px;height:60px;opacity:0}}

  .rec-notes{background:#111a2e;color:#c7cbd3;padding:14px 18px;border-top:1px solid #1f2a44;min-height:58px}
  .rec-notes .nl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:4px;font-weight:600}
  .rec-notes .nb{font-size:13px;line-height:1.5}
  .rec-notes .nb .hl{background:rgba(124,58,237,.25);color:#c4b5fd;padding:1px 5px;border-radius:2px;border:1px solid rgba(124,58,237,.4)}

  /* STAGE 3: conversational refinement */
  .chat{margin-top:20px}
  .msg{display:flex;gap:12px;margin-bottom:16px;animation:fadeIn .25s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg .av{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .msg.user .av{background:linear-gradient(135deg,#6366f1,#818cf8)}
  .msg .bubble{flex:1;min-width:0}
  .msg .who{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .msg .body{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.55;color:#1f2937}
  .msg.user .body{background:var(--blue-50);border-color:var(--blue-100);color:#1e3a8a}
  .msg .obs{background:#fafbfc;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#374151}
  .msg .obs .ico{width:28px;height:28px;border-radius:6px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
  .msg .obs b{color:#111827}

  .quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .qr{padding:7px 13px;background:#fff;border:1px solid var(--border-strong);border-radius:999px;font-size:13px;cursor:pointer;color:#374151;transition:all .1s}
  .qr:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}
  .qr.picked{background:var(--blue);border-color:var(--blue);color:#fff}

  .composer{background:#fff;border:1.5px solid var(--border-strong);border-radius:10px;padding:4px 4px 4px 14px;display:flex;align-items:center;gap:8px;margin-top:22px;position:sticky;bottom:22px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
  .composer input{flex:1;border:none;outline:none;font:inherit;font-size:14px;padding:10px 0;background:transparent}
  .composer .send{background:var(--blue);color:#fff;border:none;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}

  /* STAGE 4: agent card — one paragraph */
  .agent-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:22px}
  .ac-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fafbfc,#fff)}
  .ac-head .ico{width:40px;height:40px;border-radius:10px;background:var(--emerald-50);color:var(--emerald-600);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .ac-head .meta h2{font-size:17px;font-weight:600;margin:0}
  .ac-head .meta .s{color:var(--muted);font-size:12.5px;margin-top:1px}
  .ac-head .right{margin-left:auto;display:flex;gap:6px}

  .ac-body{padding:24px;font-size:15.5px;line-height:1.75;color:#1f2937}
  .ac-body .para{text-wrap:pretty}
  .judgment{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;border:1px solid #fcd34d;color:#78350f;padding:2px 9px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;transition:all .1s}
  .judgment:hover{background:#fde68a;border-color:#f59e0b}
  .judgment::before{content:"⚡";font-size:11px}
  .fact{display:inline-flex;align-items:center;background:var(--blue-50);border:1px solid var(--blue-100);color:var(--blue-700);padding:2px 9px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer}
  .fact:hover{background:#dbeafe}

  .ac-foot{padding:14px 24px;background:#fafbfc;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .ac-foot .small{font-size:12px;color:var(--muted)}
  .ac-foot .rt{margin-left:auto;display:flex;gap:8px}

  /* STAGE 5: trust loop */
  .trust{margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .trust-hd{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .trust-hd .t{font-weight:600;font-size:15px}
  .trust-hd .s{color:var(--muted);font-size:12.5px;margin-left:auto}
  .trust-body{padding:22px 24px}
  .trust-stage{aspect-ratio:16/9;background:linear-gradient(135deg,#0b1220,#1e293b);border-radius:8px;position:relative;overflow:hidden;border:1px solid #1f2a44}
  .ts-status{position:absolute;top:12px;left:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:6px 11px;border-radius:999px;color:#fff;font-size:12px;display:flex;align-items:center;gap:8px;z-index:10}
  .ts-status .d{width:8px;height:8px;border-radius:999px;background:#10b981;box-shadow:0 0 0 2px rgba(16,185,129,.3)}
  .ts-narrator{position:absolute;bottom:14px;left:14px;right:14px;background:rgba(11,18,32,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);padding:12px 16px;border-radius:8px;color:#fff;z-index:10}
  .ts-narrator .tiny{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#a78bfa;font-weight:700;margin-bottom:3px}
  .ts-narrator .big{font-size:14px;line-height:1.45}

  .ts-app{position:absolute;left:12%;top:12%;width:75%;height:68%;background:#fff;border-radius:3px;border:1px solid #cbd5e0;display:flex;flex-direction:column;overflow:hidden}
  .ts-app .tb{background:#003366;color:#fff;padding:4px 10px;font-weight:700;font-size:11px}
  .ts-app .body{flex:1;padding:12px;font-size:10px}
  .ts-bb{position:absolute;border:2px solid #10b981;border-radius:2px;box-shadow:0 0 0 3px rgba(16,185,129,.2);z-index:6;animation:bbin .4s ease-out}
  @keyframes bbin{from{box-shadow:0 0 0 12px rgba(16,185,129,0)}to{box-shadow:0 0 0 3px rgba(16,185,129,.2)}}
  .ts-bb .lb{position:absolute;top:-20px;left:-1px;background:#10b981;color:#000;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}

  .feedback{display:flex;gap:8px;margin-top:16px;justify-content:center}
  .fb-btn{padding:9px 18px;border:1px solid var(--border-strong);border-radius:999px;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;font-weight:500}
  .fb-btn:hover{background:#f8f9fb}
  .fb-btn.good:hover{border-color:var(--emerald-500);color:var(--emerald-600);background:var(--emerald-50)}
  .fb-btn.bad:hover{border-color:var(--red-600);color:var(--red-600);background:var(--red-50)}

  /* STAGE 6: live */
  .live{background:linear-gradient(135deg,#ecfdf5,#fff);border:1px solid #a7f3d0;border-radius:10px;padding:32px;text-align:center;margin-top:22px}
  .live .bigcheck{width:58px;height:58px;background:var(--emerald-500);color:#fff;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px;box-shadow:0 8px 20px rgba(16,185,129,.3)}
  .live h2{font-size:22px}
  .live .lede{margin:6px auto 22px;max-width:520px}
  .live-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:580px;margin:0 auto 18px}
  .ls{background:#fff;border:1px solid var(--emerald-100);border:1px solid #a7f3d0;border-radius:8px;padding:12px}
  .ls .n{font-family:ui-monospace,monospace;font-size:22px;font-weight:500;color:var(--emerald-600)}
  .ls .l{font-size:10.5px;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.06em}

  /* popover for judgment edit */
  .pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:14px 16px;width:320px}
  .pop .th{font-weight:600;font-size:13px;margin-bottom:8px}
  .pop .choices{display:flex;flex-direction:column;gap:4px}
  .pop .ch{padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;border:1px solid transparent}
  .pop .ch:hover{background:#fafbfc;border-color:var(--border)}
  .pop .ch.on{background:var(--blue-50);border-color:var(--blue)}

  /* small helpers */
  .hide{display:none}
  .stage-wrap{animation:slideUp .3s ease-out}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* stage indicator */
  .stages{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:22px;margin-top:4px}
  .sg{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--border)}
  .sg.done{color:var(--emerald-600);border-color:#a7f3d0;background:var(--emerald-50)}
  .sg.active{color:var(--blue);border-color:var(--blue);background:var(--blue-50);font-weight:600}
  .sg-arrow{color:#cbd5e0;font-size:10px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function TopNav(){
  return <div className="topnav">
    <div className="brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 4l8 0 -4 4 4 4 -8 0 4 -4z M8 14l8 0 -4 4 4 4 -8 0 4 -4z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg>
      Solitude
    </div>
    <div className="nav-btn">Invoices</div>
    <div className="nav-btn">Disputes</div>
    <div className="nav-btn">Analytics</div>
    <div className="nav-btn active">Agents</div>
    <div className="right">
      <span className="avatar">MD</span>
      <span>Maria Delgado ▾</span>
    </div>
  </div>;
}

function StageIndicator({stage}){
  const stages = [
    {k:"intro",   l:"Start"},
    {k:"rec",     l:"Show it"},
    {k:"chat",    l:"Answer a few things"},
    {k:"review",  l:"Review"},
    {k:"trust",   l:"Watch it"},
    {k:"live",    l:"Live"},
  ];
  const i = stages.findIndex(s => s.k === stage);
  return <div className="stages">
    {stages.map((s,idx) => <React.Fragment key={s.k}>
      {idx > 0 && <span className="sg-arrow">›</span>}
      <span className={`sg ${idx < i ? "done" : idx === i ? "active" : ""}`}>
        {idx < i && "✓ "}{s.l}
      </span>
    </React.Fragment>)}
  </div>;
}

/* ============ STAGE 1: INTRO ============ */
function Intro({onRecord, onSuggestion}){
  const suggestions = [
    "Post shipments to RouteTMS after matching",
    "Check carrier invoices against rate cons",
    "Download CoAs from supplier portals",
    "Send dispute evidence to carriers",
    "Reconcile load tenders with confirmations",
  ];
  return <div className="stage-wrap">
    <div className="hero">
      <div className="glow"/>
      <h1>Teach an agent by showing it.</h1>
      <div className="lede">Do the job once while the agent watches. It'll figure out the rest and ask you a few questions to get it right.</div>

      <div className="startrow">
        <div className="start-card primary" onClick={onRecord}>
          <span className="badge">Recommended</span>
          <div className="icon">●</div>
          <div className="t">Record me doing the job once</div>
          <div className="s">Open your apps and work a real example. The agent watches what you do, not which buttons you press — so small changes won't break it.</div>
        </div>
        <div className="start-card alt" onClick={()=>onSuggestion("Post shipments to RouteTMS after matching")}>
          <div className="icon">✎</div>

/* ============ STAGE 2: RECORDING ============ */
const REC_SCRIPT = [
  { t:2,  cursor:{x:22, y:22}, note:"You opened your email and found the new invoice from Cedar Ridge Transport." },
  { t:5,  cursor:{x:52, y:48}, note:"You switched to RouteTMS." },
  { t:9,  cursor:{x:38, y:32}, click:true, note:"You searched for PRO number I-40021186." },
  { t:13, cursor:{x:55, y:52}, click:true, row:0, note:"You opened the shipment. I noticed you checked the carrier name and amount." },
  { t:18, cursor:{x:52, y:50}, note:"You paused on the rate con for about 3 seconds. Looks like you were verifying the amount matches." },
  { t:24, cursor:{x:72, y:82}, click:true, post:true, note:"You clicked Post. The shipment was posted to RouteTMS." },
];

function Recording({onDone}){
  const [elapsed, setElapsed] = useState(0);
  const [step, setStep] = useState(0);
  const [clicked, setClicked] = useState(null);

  useEffect(() => {
    const iv = setInterval(() => setElapsed(e => e + 0.5), 500);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    const next = REC_SCRIPT.findIndex(s => s.t > elapsed);
    const idx = next === -1 ? REC_SCRIPT.length - 1 : Math.max(0, next - 1);
    if (idx !== step) {
      setStep(idx);
      const s = REC_SCRIPT[idx];
      if (s.click) {
        setClicked({x:s.cursor.x, y:s.cursor.y, id:Date.now()});
        setTimeout(()=>setClicked(null), 600);
      }
    }
    if (elapsed > 28) onDone();
  }, [elapsed, step]);

  const curr = REC_SCRIPT[step];
  const mm = String(Math.floor(elapsed/60)).padStart(2,"0");
  const ss = String(Math.floor(elapsed%60)).padStart(2,"0");

  return <div className="stage-wrap">
    <h1>Go ahead — do the job.</h1>
    <div className="lede">I'm watching. When you're done, click Stop and I'll walk you through what I learned.</div>

    <div className="rec-shell">
      <div className="rec-bar">
        <span className="rec-dot"/>
        <span className="rec-status">Recording</span>
        <span style={{color:"#9aa3b7"}}>· cloud desktop (so your real work isn't affected)</span>
        <span className="rec-clock">{mm}:{ss}</span>
        <button className="rec-stop" onClick={onDone}>■ Stop</button>
      </div>

      <div className="rec-frame">
        <div className="watching">
          <span className="eye">✓</span>
          <span>Watching · learned {step+1} thing{step===0?"":"s"} so far</span>
        </div>

        <div className="rec-app">
          <div className="tb">RouteTMS — app.routetms.example</div>
          <div className="menu">
            <span>File</span><span>Reports</span><span style={{fontWeight:700,color:"#003366"}}>Shipments</span><span>Invoices</span>
          </div>
          <div className="body">
            {step >= 2 && <div style={{marginBottom:6,padding:"3px 6px",border:"1px solid #cbd5e0",background:"#fff",fontFamily:"monospace",fontSize:9.5}}>Search: I-40021186</div>}
            <table>
              <thead><tr><th>PRO#</th><th>Carrier</th><th>Amount</th><th>Status</th></tr></thead>
              <tbody>
                <tr className={step >= 3 ? "on" : ""}><td>I-40021186</td><td>Cedar Ridge Transport Inc</td><td>$4,260</td><td>Matched</td></tr>
                <tr><td>I-40021187</td><td>Cedar Ridge Transport Inc</td><td>$3,140</td><td>Matched</td></tr>
                <tr><td>I-40021188</td><td>Lakeview Logistics</td><td>$2,880</td><td>Pending</td></tr>
              </tbody>
            </table>
            {step >= 4 && <div style={{marginTop:8,padding:6,background:"#eef2f7",fontSize:9}}>
              <b>Rate con:</b> $4,260 · Cedar Ridge Transport · LAX → DFW · matches invoice ✓
            </div>}
          </div>
          {step >= 5 && <div className="rec-app post" style={{position:"absolute",right:"14%",bottom:"12%"}}>POST to TMS</div>}
        </div>

        <svg className="rec-cursor" style={{left:`${curr.cursor.x}%`,top:`${curr.cursor.y}%`}} viewBox="0 0 24 24" fill="#fff" stroke="#000" strokeWidth="1.5"><path d="M5 3 L5 19 L9 15 L12 22 L15 21 L12 14 L18 14 Z"/></svg>
        {clicked && <div className="rec-ripple" key={clicked.id} style={{left:`${clicked.x}%`,top:`${clicked.y}%`}}/>}
      </div>

      <div className="rec-notes">
        <div className="nl">Just learned</div>
        <div className="nb">{renderNote(curr.note)}</div>
      </div>
    </div>
  </div>;
}

function renderNote(text){
  // highlight phrases like 'PRO number', 'Cedar Ridge Transport', amount, Post
  const patterns = ["I-40021186","Cedar Ridge Transport","Post","rate con","PRO number","carrier name","amount"];
  let out = [text];
  patterns.forEach(p => {
    const next = [];
    out.forEach(chunk => {
      if (typeof chunk !== "string") return next.push(chunk);
      const parts = chunk.split(new RegExp(`(${p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,"i"));
      parts.forEach((x,i)=> next.push(i%2===1 ? <span key={i+p} className="hl">{x}</span> : x));
    });
    out = next;
  });
  return out;
}

/* ============ STAGE 3: CONVERSATIONAL REFINEMENT ============ */
const CHAT_SCRIPT = [
  {
    who:"agent",
    body:"Okay, I watched you post that Cedar Ridge Transport shipment. I think I got the shape of the job. Let me check a few things so I don't get them wrong when I do it on my own.",
    obs:{ico:"📋", text:<>I saw you <b>check the rate con against the invoice</b> before posting, about 3 seconds of reading. Is that something you always do, or only for certain carriers?</>},
    replies:["Always — it's the main thing","Only for new carriers","Only if the amount seems off"]
  },
  {
    who:"agent",
    body:"Got it. And about the posting itself —",
    obs:{ico:"✍️", text:<>You clicked <b>Post</b> yourself at the end. Should I do that on my own, or stop and show you the shipment first so you can give a thumbs-up?</>},
    replies:["Show me each one first","Only stop on weird ones","Just do it — I trust you"]
  },
  {
    who:"agent",
    body:"One more — what counts as 'weird' to you?",
    obs:{ico:"⚡", text:<>Things like: invoice amount more than expected, unfamiliar carrier, missing BOL, dates that don't make sense. Pick whichever you want me to flag.</>},
    replies:["Amount off by $100+","New carrier I haven't seen","Missing paperwork","Dates look wrong"],
    multi:true,
  },
];

function Chat({onDone}){
  const [visible, setVisible] = useState(1);
  const [answers, setAnswers] = useState({});
  const [input, setInput] = useState("");
  const [extras, setExtras] = useState([]);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({behavior:"smooth", block:"end"}); }, [visible, answers, extras]);

  const sendExtra = () => {
    const v = input.trim();
    if (!v) return;
    setExtras([...extras, v]);
    setInput("");
  };

  const pick = (idx, reply) => {
    const current = CHAT_SCRIPT[idx];
    if (current.multi) {
      const existing = answers[idx] || [];
      const next = existing.includes(reply) ? existing.filter(x=>x!==reply) : [...existing, reply];
      setAnswers({...answers, [idx]:next});
    } else {
      setAnswers({...answers, [idx]:reply});
      setTimeout(()=>setVisible(v => Math.min(CHAT_SCRIPT.length, v+1)), 500);
    }
  };

  const confirmMulti = (idx) => setTimeout(()=>setVisible(v => Math.min(CHAT_SCRIPT.length, v+1)), 300);

  return <div className="stage-wrap">
    <h1>A few quick things.</h1>
    <div className="lede">These are the judgment calls I wasn't sure about. Pick what feels right — you can always change any of it later.</div>

    <div className="chat">
      {CHAT_SCRIPT.slice(0, visible).map((m,idx) => <div key={idx} className="msg">
        <div className="av">AI</div>
        <div className="bubble">
          <div className="who">Agent</div>
          <div className="body">
            {m.body}
            {m.obs && <div className="obs"><div className="ico">{m.obs.ico}</div><div>{m.obs.text}</div></div>}
            {!m.multi && <div className="quick-replies">
              {m.replies.map(r => <span key={r} className={`qr ${answers[idx]===r?"picked":""}`} onClick={()=>pick(idx,r)}>{r}</span>)}
            </div>}
            {m.multi && <>
              <div className="quick-replies">
                {m.replies.map(r => <span key={r} className={`qr ${(answers[idx]||[]).includes(r)?"picked":""}`} onClick={()=>pick(idx,r)}>{(answers[idx]||[]).includes(r) && "✓ "}{r}</span>)}
              </div>
              {(answers[idx]||[]).length > 0 && idx === visible-1 && <button className="btn btn-primary btn-xs" style={{marginTop:10}} onClick={()=>confirmMulti(idx)}>That's everything ✓</button>}
            </>}
          </div>
        </div>
      </div>)}

      {answers[0] && <div className="msg user">
        <div className="av">MD</div>
        <div className="bubble"><div className="who">You</div><div className="body">{answers[0]}</div></div>
      </div>}

      {extras.map((x,i) => <React.Fragment key={"ex"+i}>
        <div className="msg user">
          <div className="av">MD</div>
          <div className="bubble"><div className="who">You</div><div className="body">{x}</div></div>
        </div>
        <div className="msg">
          <div className="av">AI</div>
          <div className="bubble"><div className="who">Agent</div><div className="body">Got it — I'll fold that in. Noted: <i>"{x}"</i>.</div></div>
        </div>
      </React.Fragment>)}

      {visible >= CHAT_SCRIPT.length && answers[2] && (answers[2]||[]).length > 0 && <div className="msg">
        <div className="av">AI</div>
        <div className="bubble">
          <div className="who">Agent</div>
          <div className="body">
            Perfect. I think I've got enough. Let me show you what I'm going to do — and then we can watch it run once before you turn it loose.
            <div style={{marginTop:12}}>
              <button className="btn btn-primary" onClick={onDone}>Show me what you learned →</button>
            </div>
          </div>
        </div>
      </div>}

      <div ref={endRef}/>
    </div>

    {visible >= CHAT_SCRIPT.length && <div className="composer">
      <input placeholder="Anything I missed? Add it here…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendExtra()}/>
      <button className="send" onClick={sendExtra}>↑</button>
    </div>}
  </div>;
}

          <span>, </span>
          <span className="fact">missing paperwork</span>
          <span>, or </span>
          <span className="fact">dates that don't line up</span>

        </div>
      </div>

      <div className="ac-foot">

    {pop && <>
      <div style={{position:"fixed",inset:0,zIndex:40}} onClick={()=>setPop(null)}/>
      <div className="pop" style={{left:Math.min(pop.x,window.innerWidth-340),top:pop.y+12}}>

        <div className="choices">
          {JUDGMENTS[pop.k].choices.map(c =>
            <div key={c.k} className={`ch ${j[pop.k]===c.k?"on":""}`} onClick={()=>chooseJ(pop.k,c.k)}>
              {j[pop.k]===c.k && "● "}{c.l}
            </div>)}

      </div>
    </>}
  </div>;
}

/* ============ STAGE 5: TRUST LOOP — watch it do one ============ */
const WATCH_NARR = [
  { t:0,   text:"I'm opening RouteTMS now…",                             bb:null },
  { t:2,   text:"Signed in with your RouteTMS login.",                  bb:{x:8,y:20,w:18,h:10,lb:"Signed in"} },
  { t:4,   text:"Looking for shipment I-40021186 in the list.",       bb:{x:12,y:48,w:12,h:6,lb:"PRO#"} },
  { t:6,   text:"Found it. Carrier is Cedar Ridge Transport — that's not new. Amount is $4,260, matches the rate con.", bb:{x:12,y:58,w:60,h:7,lb:"I-40021186 · $4,260"} },

  { t:12,  text:"Waiting for your thumbs-up.",                        bb:{x:58,y:76,w:18,h:9,lb:"Ready to post"}, waiting:true },
];

function TrustLoop({onLive}){
  const [t, setT] = useState(0);
  const [feedback, setFeedback] = useState(null);

  useEffect(() => {
    if (t >= 12) return;
    const iv = setTimeout(() => setT(t + 1), 900);
    return () => clearTimeout(iv);
  }, [t]);

  const cur = WATCH_NARR.reduce((acc, n) => n.t <= t ? n : acc, WATCH_NARR[0]);

  return <div className="stage-wrap">
    <h1>Here I go. Watch me.</h1>
    <div className="lede">This is a real run on a real shipment. I'll stop before doing anything permanent so you can give me a thumbs-up.</div>

    <div className="trust">
      <div className="trust-hd">
        <span className="pill pill-emerald"><span className="dot"/>Running</span>
        <span className="t">Shipment I-40021186 · Cedar Ridge Transport · $4,260</span>
        <span className="s">{t}s elapsed</span>
      </div>
      <div className="trust-body">
        <div className="trust-stage">

          <div className="ts-app">
            <div className="tb">RouteTMS — Shipments</div>
            <div className="body">
              {t >= 2 && <div style={{fontSize:9.5,marginBottom:5}}>✓ Signed in as <b>ops@northwind.example</b></div>}
              {t >= 4 && <table style={{width:"100%",borderCollapse:"collapse",fontSize:9.5}}>
                <thead><tr style={{background:"#eef2f7"}}><th style={{padding:"2px 4px",textAlign:"left"}}>PRO#</th><th style={{padding:"2px 4px",textAlign:"left"}}>Carrier</th><th style={{padding:"2px 4px",textAlign:"left"}}>Amount</th></tr></thead>

                  <tr><td style={{padding:"2px 4px",fontFamily:"monospace"}}>I-40021187</td><td style={{padding:"2px 4px"}}>Cedar Ridge Transport</td><td style={{padding:"2px 4px",fontFamily:"monospace"}}>$3,140</td></tr>
                </tbody>

              {t >= 6 && <div style={{marginTop:6,padding:6,background:"#ecfdf5",border:"1px solid #a7f3d0",fontSize:9,color:"#065f46"}}>

          <div style={{marginTop:18,padding:"14px 18px",background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:8,display:"flex",alignItems:"center",gap:12}}>

              <div style={{fontWeight:600,color:"#78350f"}}>Ready to post — waiting for your OK.</div>
              <div style={{fontSize:13,color:"#92400e",marginTop:2}}>About to click POST on shipment I-40021186 for $4,260.</div>
            </div>
            <button className="btn btn-emerald" onClick={()=>setFeedback("good")}>✓ Go ahead</button>

          </div>

          <div className="feedback">
            <button className="fb-btn good" onClick={()=>setFeedback("good")}>👍 Looks right</button>
            <button className="fb-btn bad"  onClick={()=>setFeedback("bad")}>👎 Something's off — let me tell you what</button>
          </div>
        </>}

        {feedback === "good" && <div style={{marginTop:16,padding:14,background:"#ecfdf5",border:"1px solid #a7f3d0",borderRadius:8,textAlign:"center"}}>
          <div style={{fontWeight:600,color:"#065f46"}}>✓ Nice. Posted.</div>

        {feedback === "bad" && <div style={{marginTop:16,padding:14,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8}}>
          <div style={{fontWeight:600,color:"#991b1b",marginBottom:6}}>Tell me what I should've caught.</div>

/* ============ APP ============ */
function App(){
  const [stage, setStage] = useState("intro");
  const [judgments, setJudgments] = useState({ j1:"always", j2:"each", j3:"100" });

  const reset = () => {
    setJudgments({ j1:"always", j2:"each", j3:"100" });
    setStage("intro");
  };

  return <>
    <TopNav/>
    <div className="canvas">
      <StageIndicator stage={stage}/>

      {stage === "intro"  && <Intro onRecord={()=>setStage("rec")} onSuggestion={()=>setStage("rec")}/>}
      {stage === "rec"    && <Recording onDone={()=>setStage("chat")}/>}
      {stage === "chat"   && <Chat onDone={()=>setStage("review")}/>}
      {stage === "review" && <AgentCard onWatch={()=>setStage("trust")} judgments={judgments} setJudgments={setJudgments}/>}
      {stage === "trust"  && <TrustLoop onLive={()=>setStage("live")}/>}
      {stage === "live"   && <Live onReset={reset}/>}
    </div>
  </>;
}
